# Build and deploy the Guushu site (Python static builder) to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Test job: L1 (pure JS unit tests) + L2/L3 (build output & snapshot tests)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node deps (dart-sass)
        run: npm install

      - name: Run L1 unit tests (pure JS)
        run: node test/run-all.js

      - name: Run IndexNow script tests
        run: node --test test/indexnow.test.mjs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build site for L2/L3 tests
        run: python build.py

      - name: Run L2/L3 build-output & snapshot tests
        run: node test/run-build.js

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node deps (dart-sass)
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      # The IndexNow job reads the URL list from this build, not from
      # production (the zone's bot rules challenge GitHub runner IPs).
      - name: Keep sitemap for IndexNow
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemap
          path: ./_site/sitemap.xml
          retention-days: 1

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell IndexNow (Bing / Yandex / Seznam / Naver) about the URLs once the new
  # build is live. Never fails the workflow: the script only warns.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download sitemap
        uses: actions/download-artifact@v4
        with:
          name: indexnow-sitemap
          path: ./_site

      - name: Submit to IndexNow
        run: node scripts/indexnow.mjs --sitemap _site/sitemap.xml
